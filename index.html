<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Masjid Al-Khoirot</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden; 
        }
        .running-text {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 25s linear infinite;
        }
        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
        
        /* Animasi Glow Oranye untuk Card Jum'at Ini */
        @keyframes jumatGlowOrange {
            0%, 100% {
                box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
                border-color: rgba(249, 115, 22, 0.6);
            }
            50% {
                box-shadow: 0 0 25px rgba(249, 115, 22, 0.8);
                border-color: rgba(253, 186, 116, 1);
            }
        }
        .card-jumat-ini {
            animation: jumatGlowOrange 2s infinite ease-in-out;
            background-color: rgba(249, 115, 22, 0.1);
        }

        .fade-transition {
            transition: opacity 800ms ease-in-out;
        }

        /* Latar Belakang Mesjid Khas Referensi */
        .bg-reference {
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.5), rgba(15, 23, 42, 0.7)), 
                        url('https://images.unsplash.com/photo-1542810634-71277d95dcbb?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* Pembatas Titik Ornamen Khas Referensi */
        .divider-dots {
            border-right: 2px dotted rgba(255, 255, 255, 0.25);
        }
        .divider-dots:last-child {
            border-right: none;
        }

        /* Custom Scrollbar Halus */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-reference text-white min-h-screen lg:h-screen w-screen flex flex-col justify-between p-4 sm:p-5 select-none overflow-y-auto lg:overflow-hidden gap-4">

    <!-- BARIS ATAS: Header Bentuk Kotak Rounded Normal -->
    <header class="bg-white/20 backdrop-blur-md rounded-2xl flex flex-col sm:flex-row justify-between items-center px-6 sm:px-8 py-3.5 shadow-lg border border-white/30 shrink-0 z-20 gap-3 sm:gap-0">
        <!-- Kiri: Logo Masjid + Nama & Alamat -->
        <div class="flex items-center gap-4 text-center sm:text-left">
            <img id="logo-img" src="logo.jpeg" 
                 onError="this.onerror=null; this.src='logo-masjid.png'; if(!this.src) this.src='https://img.icons8.com/color/96/mosque.png';" 
                 alt="Logo Masjid Al-Khoirot" 
                 class="w-14 h-14 sm:w-16 sm:h-16 rounded-xl object-contain p-1 shadow-md border border-white/60 bg-white/95 shrink-0">
            <div>
                <h1 id="nama-masjid" class="text-xl sm:text-3xl font-black uppercase tracking-tight text-white drop-shadow-md leading-tight">Memuat...</h1>
                <p id="tagline-masjid" class="text-slate-200 text-xs sm:text-sm font-medium tracking-wide drop-shadow-md max-w-xl">Memuat...</p>
            </div>
        </div>

        <!-- Kanan: Jam & Tanggal -->
        <div class="text-center sm:text-right">
            <h2 id="jam" class="text-4xl sm:text-5xl font-black text-white tracking-tight drop-shadow-md">00:00:00</h2>
            <p id="tanggal" class="text-xs sm:text-sm font-bold text-amber-400 tracking-wide drop-shadow-md mt-0.5">Memuat tanggal...</p>
        </div>
    </header>

    <!-- BARIS TENGAH: 70% Slider (Full-Bleed) & 30% Khutbah -->
    <main class="flex-1 flex flex-col lg:flex-row gap-4 min-h-0 overflow-visible lg:overflow-hidden z-10">
        
        <!-- Area Kiri: Slider Gambar (70% - Tanpa Container, Langsung Gambar) -->
        <div class="w-full lg:w-[70%] h-64 sm:h-80 lg:h-full rounded-2xl overflow-hidden relative shadow-2xl shrink-0 lg:shrink">
            <img id="poster-img" src="" alt="Slider" class="w-full h-full object-cover opacity-100 fade-transition bg-black/50">
            <!-- Overlay Judul di Bawah Slider -->
            <div id="poster-overlay" class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-slate-950/95 via-slate-950/60 to-transparent p-5 sm:p-8 fade-transition">
                <h2 id="poster-judul" class="text-xl sm:text-3xl font-bold text-amber-400 drop-shadow-md">Memuat...</h2>
                <p id="poster-deskripsi" class="text-sm sm:text-lg mt-1.5 text-slate-100 line-clamp-2">Memuat...</p>
            </div>
        </div>

        <!-- Area Kanan: Jadwal Khotib & Bilal (30% - Container Kaca Slate Gelap Nyaman) -->
        <div class="w-full lg:w-[30%] min-h-[22rem] lg:h-full bg-slate-900/60 backdrop-blur-md rounded-2xl shadow-xl flex flex-col overflow-hidden border border-white/20 p-4 shrink-0 lg:shrink">
            <!-- Judul Jadwal Khutbah -->
            <div class="bg-slate-950/50 px-3 py-3 text-center rounded-xl mb-3 shrink-0 border border-white/10 shadow-sm">
                <h3 class="text-sm sm:text-base lg:text-lg font-black text-amber-400 uppercase tracking-widest drop-shadow-md">Jadwal Khotib & Bilal</h3>
            </div>
            
            <!-- Container Daftar Khutbah -->
            <div id="container-khutbah" class="flex-1 flex flex-col gap-3 overflow-y-auto pr-1">
                <!-- Data JSON dimuat dinamis di sini -->
            </div>
        </div>
    </main>

    <!-- BARIS BAWAH: Jadwal Sholat & Running Text (Kotak Rounded Normal) -->
    <div class="flex flex-col gap-3 shrink-0 z-20">
        
        <!-- Jadwal Sholat (Bentuk Kotak Rounded-2xl) -->
        <section class="bg-white/20 backdrop-blur-md rounded-2xl px-4 sm:px-6 py-3 shadow-lg border border-white/30">
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 text-center items-center">
                <div id="box-subuh" class="py-1.5 rounded-xl transition-all duration-300 divider-dots">
                    <p id="title-subuh" class="text-slate-100 font-extrabold uppercase tracking-widest text-[11px] sm:text-sm drop-shadow">Subuh</p>
                    <p id="waktu-subuh" class="text-2xl sm:text-4xl font-black mt-0.5 text-white drop-shadow-md">--:--</p>
                </div>
                <div id="box-syuruq" class="py-1.5 rounded-xl transition-all duration-300 divider-dots">
                    <p id="title-syuruq" class="text-slate-100 font-extrabold uppercase tracking-widest text-[11px] sm:text-sm drop-shadow">Syuruq</p>
                    <p id="waktu-syuruq" class="text-2xl sm:text-4xl font-black mt-0.5 text-white drop-shadow-md">--:--</p>
                </div>
                <div id="box-dzuhur" class="py-1.5 rounded-xl transition-all duration-300 divider-dots">
                    <p id="title-dzuhur" class="text-slate-100 font-extrabold uppercase tracking-widest text-[11px] sm:text-sm drop-shadow">Dzuhur</p>
                    <p id="waktu-dzuhur" class="text-2xl sm:text-4xl font-black mt-0.5 text-white drop-shadow-md">--:--</p>
                </div>
                <div id="box-ashar" class="py-1.5 rounded-xl transition-all duration-300 divider-dots">
                    <p id="title-ashar" class="text-slate-100 font-extrabold uppercase tracking-widest text-[11px] sm:text-sm drop-shadow">Ashar</p>
                    <p id="waktu-ashar" class="text-2xl sm:text-4xl font-black mt-0.5 text-white drop-shadow-md">--:--</p>
                </div>
                <div id="box-maghrib" class="py-1.5 rounded-xl transition-all duration-300 divider-dots">
                    <p id="title-maghrib" class="text-slate-100 font-extrabold uppercase tracking-widest text-[11px] sm:text-sm drop-shadow">Maghrib</p>
                    <p id="waktu-maghrib" class="text-2xl sm:text-4xl font-black mt-0.5 text-white drop-shadow-md">--:--</p>
                </div>
                <div id="box-isya" class="py-1.5 rounded-xl transition-all duration-300">
                    <p id="title-isya" class="text-slate-100 font-extrabold uppercase tracking-widest text-[11px] sm:text-sm drop-shadow">Isya</p>
                    <p id="waktu-isya" class="text-2xl sm:text-4xl font-black mt-0.5 text-white drop-shadow-md">--:--</p>
                </div>
            </div>
        </section>

        <!-- Running Text (Kotak Rounded-2xl) -->
        <footer class="bg-slate-950/60 backdrop-blur-md rounded-2xl h-12 sm:h-14 flex items-center overflow-hidden border border-white/20 shadow-lg">
            <div class="bg-amber-500 text-slate-950 font-black px-4 sm:px-6 h-full flex items-center z-10 shadow-md tracking-widest text-[10px] sm:text-sm uppercase">
                INFORMASI
            </div>
            <div class="flex-1 overflow-hidden relative h-full flex items-center">
                <div id="running-text" class="running-text text-amber-300 font-bold tracking-wide text-sm sm:text-base drop-shadow-md">
                    Memuat informasi...
                </div>
            </div>
        </footer>
        
    </div>

    <script>
        let slideData = [];
        let currentSlideIndex = 0;
        const prayerNames = ['subuh', 'syuruq', 'dzuhur', 'ashar', 'maghrib', 'isya'];
        let prayerTimesData = {};

        // 1. Update Jam Realtime
        function updateWaktu() {
            const waktu = new Date();
            document.getElementById('jam').textContent = `${String(waktu.getHours()).padStart(2, '0')}:${String(waktu.getMinutes()).padStart(2, '0')}:${String(waktu.getSeconds()).padStart(2, '0')}`;
            const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jum\'at', 'Sabtu'];
            const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            document.getElementById('tanggal').textContent = `${namaHari[waktu.getDay()]}, ${waktu.getDate()} ${namaBulan[waktu.getMonth()]} ${waktu.getFullYear()}`;

            highlightNextPrayer(waktu);
        }
        setInterval(updateWaktu, 1000);
        updateWaktu();

        // 2. Slider Transisi Halus
        function tampilkanSlide(index) {
            if (slideData.length === 0) return;
            const imgEl = document.getElementById('poster-img');
            const overlayEl = document.getElementById('poster-overlay');

            imgEl.style.opacity = '0';
            overlayEl.style.opacity = '0';

            setTimeout(() => {
                const slide = slideData[index];
                imgEl.src = slide.gambar;

                const judul = slide.judul ? slide.judul.trim() : '';
                const deskripsi = slide.deskripsi ? slide.deskripsi.trim() : '';

                if (!judul && !deskripsi) {
                    overlayEl.classList.add('hidden');
                } else {
                    overlayEl.classList.remove('hidden');
                    document.getElementById('poster-judul').textContent = judul;
                    document.getElementById('poster-deskripsi').textContent = deskripsi;
                }

                imgEl.style.opacity = '1';
                overlayEl.style.opacity = '1';
            }, 500);
        }

        function parseTanggalIndo(str) {
            const bulanIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const parts = str.replace(/,/g, '').split(' ');
            if (parts.length >= 4) {
                const hari = parseInt(parts[1]);
                const bulan = bulanIndo.indexOf(parts[2]);
                const tahun = parseInt(parts[3]);
                return new Date(tahun, bulan, hari);
            }
            return new Date(0);
        }

        // 3. Load data.json & Render Khutbah yang Nyaman Dilihat
        async function loadDataJSON() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();

                document.getElementById('nama-masjid').textContent = data.masjid.nama;
                document.getElementById('tagline-masjid').textContent = data.masjid.tagline;
                document.getElementById('running-text').textContent = data.pengumuman;

                if (data.slides && data.slides.length > 0) {
                    slideData = data.slides;
                    tampilkanSlide(currentSlideIndex);
                }

                const hariIni = new Date();
                hariIni.setHours(0, 0, 0, 0);
                let indexJumatTerdekat = -1;

                for (let i = 0; i < data.jadwal_khutbah.length; i++) {
                    let tanggalJumat = parseTanggalIndo(data.jadwal_khutbah[i].tanggal);
                    if (tanggalJumat >= hariIni) {
                        indexJumatTerdekat = i;
                        break;
                    }
                }

                const containerKhutbah = document.getElementById('container-khutbah');
                containerKhutbah.innerHTML = ''; 

                data.jadwal_khutbah.forEach((jadwal, index) => {
                    let cardStyle = "bg-white/10 border-white/10";
                    let badge = "";

                    if (index === indexJumatTerdekat) {
                        cardStyle = "border-2 card-jumat-ini shadow-md";
                        badge = `<span class="bg-orange-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-md float-right uppercase tracking-wider animate-pulse">JUM'AT INI</span>`;
                    }

                    // Teks lebih kontras dan nyaman
                    containerKhutbah.innerHTML += `
                        <div class="${cardStyle} px-4 py-3 rounded-xl border flex flex-col justify-between overflow-hidden shrink-0">
                            <div class="mb-1.5">
                                ${badge}
                                <p class="text-xs sm:text-sm text-amber-400 font-extrabold uppercase tracking-wider leading-tight drop-shadow-md">${jadwal.tanggal}</p>
                            </div>
                            <div class="my-0.5">
                                <p class="text-[11px] font-bold text-slate-300 uppercase tracking-widest leading-none mb-0.5">Khotib:</p>
                                <p class="text-sm sm:text-base font-black text-white leading-tight drop-shadow-md truncate">${jadwal.khotib}</p>
                            </div>
                            <div class="mt-1">
                                <p class="text-[11px] font-bold text-slate-300 uppercase tracking-widest leading-none mb-0.5">Bilal:</p>
                                <p class="text-sm sm:text-base font-black text-amber-300 leading-tight drop-shadow-md truncate">${jadwal.bilal}</p>
                            </div>
                        </div>`;
                });
            } catch (error) {
                console.error("Gagal memuat JSON:", error);
            }
        }
        loadDataJSON();
        setInterval(loadDataJSON, 60000); 

        // 4. Slider Otomatis (7 Detik)
        setInterval(() => {
            if (slideData.length > 0) {
                currentSlideIndex = (currentSlideIndex + 1) % slideData.length;
                tampilkanSlide(currentSlideIndex);
            }
        }, 7000);

        // 5. Highlight Waktu Sholat Aktif (Bentuk Kotak Rounded)
        function highlightNextPrayer(waktu) {
            if (Object.keys(prayerTimesData).length === 0) return;
            const currentMins = waktu.getHours() * 60 + waktu.getMinutes();
            let nextPrayer = 'subuh';

            for (let name of prayerNames) {
                if (!prayerTimesData[name]) continue;
                let [h, m] = prayerTimesData[name].split(':').map(Number);
                let prayerMins = h * 60 + m;
                if (prayerMins > currentMins) {
                    nextPrayer = name;
                    break;
                }
            }

            prayerNames.forEach(name => {
                const box = document.getElementById(`box-${name}`);
                const title = document.getElementById(`title-${name}`);
                const time = document.getElementById(`waktu-${name}`);

                if (name === nextPrayer) {
                    box.className = "bg-gradient-to-b from-amber-500 to-orange-500 py-1.5 px-2 rounded-xl shadow-xl transform scale-110 transition-all duration-300 border border-orange-300 z-10";
                    title.className = "text-white font-black uppercase tracking-widest text-[11px] sm:text-sm drop-shadow-md";
                    time.className = "text-2xl sm:text-4xl font-black mt-0.5 text-white animate-pulse drop-shadow-lg";
                } else {
                    box.className = "py-1.5 rounded-xl transition-all duration-300 divider-dots";
                    title.className = "text-slate-100 font-extrabold uppercase tracking-widest text-[11px] sm:text-sm drop-shadow-md";
                    time.className = "text-2xl sm:text-4xl font-black mt-0.5 text-white drop-shadow-md";
                }
            });
        }

        // 6. Ambil Jadwal Kemenag
        async function fetchJadwalKemenag() {
            try {
                const today = new Date();
                const tahun = today.getFullYear();
                const bulan = String(today.getMonth() + 1).padStart(2, '0');
                const tanggal = String(today.getDate()).padStart(2, '0');
                
                const url = `https://api.myquran.com/v1/sholat/jadwal/1601/${tahun}/${bulan}/${tanggal}`;
                const response = await fetch(url);
                const result = await response.json();

                if (result.status && result.data && result.data.jadwal) {
                    const j = result.data.jadwal;
                    
                    prayerTimesData = { 
                        subuh: j.subuh, 
                        syuruq: j.terbit, 
                        dzuhur: j.dzuhur, 
                        ashar: j.ashar, 
                        maghrib: j.maghrib, 
                        isya: j.isya 
                    };

                    document.getElementById('waktu-subuh').textContent = j.subuh;
                    document.getElementById('waktu-syuruq').textContent = j.terbit; 
                    document.getElementById('waktu-dzuhur').textContent = j.dzuhur;
                    document.getElementById('waktu-ashar').textContent = j.ashar;
                    document.getElementById('waktu-maghrib').textContent = j.maghrib;
                    document.getElementById('waktu-isya').textContent = j.isya;

                    highlightNextPrayer(new Date());
                } else {
                    fetchJadwalFallback(tahun, bulan, tanggal);
                }
            } catch (error) {
                console.error("Gagal mengambil API Tirto/Kemenag:", error);
            }
        }

        async function fetchJadwalFallback(tahun, bulan, tanggal) {
            try {
                const url = `https://api.myquran.com/v2/sholat/jadwal/1601/${tahun}/${bulan}/${tanggal}`;
                const response = await fetch(url);
                const result = await response.json();
                if (result.status && result.data && result.data.jadwal) {
                    const j = result.data.jadwal;
                    prayerTimesData = { subuh: j.subuh, syuruq: j.terbit, dzuhur: j.dzuhur, ashar: j.ashar, maghrib: j.maghrib, isya: j.isya };
                    document.getElementById('waktu-subuh').textContent = j.subuh;
                    document.getElementById('waktu-syuruq').textContent = j.terbit; 
                    document.getElementById('waktu-dzuhur').textContent = j.dzuhur;
                    document.getElementById('waktu-ashar').textContent = j.ashar;
                    document.getElementById('waktu-maghrib').textContent = j.maghrib;
                    document.getElementById('waktu-isya').textContent = j.isya;
                    highlightNextPrayer(new Date());
                }
            } catch (e) {
                console.error("Fallback error:", e);
            }
        }

        fetchJadwalKemenag();
        setInterval(fetchJadwalKemenag, 3600000);
    </script>
</body>
</html>
