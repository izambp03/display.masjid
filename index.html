<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Masjid Al-Khoirot</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden; 
        }
        .running-text {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 25s linear infinite;
        }
        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
        
        /* Animasi Glow Emas/Oranye untuk Card Jum'at Ini */
        @keyframes jumatGlowOrange {
            0%, 100% {
                box-shadow: 0 0 12px rgba(249, 115, 22, 0.5);
                border-color: #f97316;
            }
            50% {
                box-shadow: 0 0 22px rgba(249, 115, 22, 0.9);
                border-color: #fdba74;
            }
        }
        .card-jumat-ini {
            animation: jumatGlowOrange 2s infinite ease-in-out;
        }

        .fade-transition {
            transition: opacity 800ms ease-in-out;
        }

        /* Latar Belakang Gambar Mesjid Khas Referensi dengan Blur Halus */
        .bg-reference {
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.65)), 
                        url('https://images.unsplash.com/photo-1542810634-71277d95dcbb?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-reference text-slate-800 min-h-screen lg:h-screen w-screen flex flex-col justify-between select-none overflow-y-auto lg:overflow-hidden">

    <!-- HEADER STYLE BARU: Glassmorphism Terang dengan Pembagi Garis Ornamen Khas Referensi -->
    <header class="bg-white/85 backdrop-blur-md flex flex-col sm:flex-row justify-between items-center px-6 lg:px-8 py-3 shadow-xl border-b border-white/50 shrink-0 z-20 gap-3 sm:gap-0">
        <!-- Atas Kiri: Logo -> Nama Masjid -> Alamat -->
        <div class="flex items-center gap-4 text-center sm:text-left">
            <img id="logo-img" src="logo.jpeg" 
                 onError="this.onerror=null; this.src='logo-masjid.png'; if(!this.src) this.src='https://img.icons8.com/color/96/mosque.png';" 
                 alt="Logo Masjid Al-Khoirot" 
                 class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl object-contain p-1 shadow-md border border-slate-200 bg-white shrink-0">
            <div>
                <h1 id="nama-masjid" class="text-2xl sm:text-3xl lg:text-3xl font-black uppercase tracking-tight text-slate-900 leading-tight">Memuat...</h1>
                <p id="tagline-masjid" class="text-slate-600 text-xs sm:text-sm font-semibold tracking-wide max-w-xl">Memuat...</p>
            </div>
        </div>

        <!-- Atas Kanan: Jam -> Hari, Tanggal, Bulan & Tahun -->
        <div class="text-center sm:text-right">
            <h2 id="jam" class="text-3xl sm:text-5xl lg:text-5xl font-black text-slate-900 tracking-tight">00:00:00</h2>
            <p id="tanggal" class="text-xs sm:text-sm font-bold text-slate-600 tracking-wide mt-0.5">Memuat tanggal...</p>
        </div>
    </header>

    <!-- KONTEN UTAMA: Split 50:50 dengan Tampilan Glass Container -->
    <main class="flex-1 flex flex-col lg:flex-row gap-4 lg:gap-6 p-4 sm:p-6 min-h-0 overflow-visible lg:overflow-hidden z-10">
        <!-- Area Slider Gambar (Sisi Kiri) -->
        <div class="w-full lg:w-6/12 h-64 sm:h-80 lg:h-full bg-slate-950/60 backdrop-blur-sm rounded-3xl overflow-hidden relative shadow-2xl border border-white/20 flex items-center justify-center shrink-0 lg:shrink">
            <img id="poster-img" src="" alt="Slider" class="w-full h-full object-cover opacity-100 fade-transition">
            <div id="poster-overlay" class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-slate-950 via-slate-950/80 to-transparent p-4 sm:p-6 fade-transition">
                <h2 id="poster-judul" class="text-lg sm:text-2xl lg:text-3xl font-bold text-amber-400 drop-shadow-md">Memuat...</h2>
                <p id="poster-deskripsi" class="text-xs sm:text-base lg:text-lg mt-1 text-slate-100 line-clamp-2">Memuat...</p>
            </div>
        </div>

        <!-- Area Jadwal Khotib & Bilal (Sisi Kanan - Gaya Referensi Terbaru) -->
        <div class="w-full lg:w-6/12 min-h-[18rem] lg:h-full bg-white/80 backdrop-blur-md rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-white/60 p-4 sm:p-5 shrink-0 lg:shrink">
            <div class="bg-slate-900 px-4 py-2.5 text-center rounded-2xl mb-3 shrink-0 shadow-md">
                <h3 class="text-base sm:text-xl lg:text-2xl font-black text-amber-400 uppercase tracking-wider">Jadwal Khotib & Bilal Bulan Ini</h3>
            </div>
            
            <!-- Container Grid Responsif -->
            <div id="container-khutbah" class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3 h-full overflow-y-auto pr-0.5">
                <!-- Data dari JSON dimuat secara dinamis -->
            </div>
        </div>
    </main>

    <!-- PANEL WAKTU SHOLAT: Meniru Gaya Kartu Melayang Referensi -->
    <section class="bg-white/85 backdrop-blur-md px-4 sm:px-6 py-3 shadow-2xl border-t border-white/60 z-20 shrink-0">
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 sm:gap-3 text-center">
            <div id="box-subuh" class="bg-slate-100/90 py-2.5 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300">
                <p id="title-subuh" class="text-slate-600 font-extrabold uppercase tracking-widest text-xs sm:text-sm">Subuh</p>
                <p id="waktu-subuh" class="text-2xl sm:text-3xl lg:text-4xl font-black mt-0.5 text-slate-900">--:--</p>
            </div>
            <div id="box-syuruq" class="bg-slate-100/90 py-2.5 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300">
                <p id="title-syuruq" class="text-slate-600 font-extrabold uppercase tracking-widest text-xs sm:text-sm">Syuruq</p>
                <p id="waktu-syuruq" class="text-2xl sm:text-3xl lg:text-4xl font-black mt-0.5 text-slate-900">--:--</p>
            </div>
            <div id="box-dzuhur" class="bg-slate-100/90 py-2.5 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300">
                <p id="title-dzuhur" class="text-slate-600 font-extrabold uppercase tracking-widest text-xs sm:text-sm">Dzuhur</p>
                <p id="waktu-dzuhur" class="text-2xl sm:text-3xl lg:text-4xl font-black mt-0.5 text-slate-900">--:--</p>
            </div>
            <div id="box-ashar" class="bg-slate-100/90 py-2.5 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300">
                <p id="title-ashar" class="text-slate-600 font-extrabold uppercase tracking-widest text-xs sm:text-sm">Ashar</p>
                <p id="waktu-ashar" class="text-2xl sm:text-3xl lg:text-4xl font-black mt-0.5 text-slate-900">--:--</p>
            </div>
            <div id="box-maghrib" class="bg-slate-100/90 py-2.5 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300">
                <p id="title-maghrib" class="text-slate-600 font-extrabold uppercase tracking-widest text-xs sm:text-sm">Maghrib</p>
                <p id="waktu-maghrib" class="text-2xl sm:text-3xl lg:text-4xl font-black mt-0.5 text-slate-900">--:--</p>
            </div>
            <div id="box-isya" class="bg-slate-100/90 py-2.5 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300">
                <p id="title-isya" class="text-slate-600 font-extrabold uppercase tracking-widest text-xs sm:text-sm">Isya</p>
                <p id="waktu-isya" class="text-2xl sm:text-3xl lg:text-4xl font-black mt-0.5 text-slate-900">--:--</p>
            </div>
        </div>
    </section>

    <!-- FOOTER RUNNING TEXT -->
    <footer class="bg-slate-950 text-white h-12 sm:h-14 flex items-center overflow-hidden text-base sm:text-xl border-t border-slate-800 z-30 shrink-0">
        <div class="bg-amber-500 text-slate-950 font-black px-4 sm:px-6 h-full flex items-center z-10 shadow-lg tracking-widest text-xs sm:text-base shrink-0 uppercase">
            INFORMASI
        </div>
        <div class="flex-1 overflow-hidden relative h-full flex items-center bg-slate-900">
            <div id="running-text" class="running-text text-amber-300 font-bold tracking-wide text-sm sm:text-lg">
                Memuat informasi...
            </div>
        </div>
    </footer>

    <script>
        let slideData = [];
        let currentSlideIndex = 0;
        const prayerNames = ['subuh', 'syuruq', 'dzuhur', 'ashar', 'maghrib', 'isya'];
        let prayerTimesData = {};

        // 1. Update Jam Realtime
        function updateWaktu() {
            const waktu = new Date();
            document.getElementById('jam').textContent = `${String(waktu.getHours()).padStart(2, '0')}:${String(waktu.getMinutes()).padStart(2, '0')}:${String(waktu.getSeconds()).padStart(2, '0')}`;
            const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jum\'at', 'Sabtu'];
            const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            document.getElementById('tanggal').textContent = `${namaHari[waktu.getDay()]}, ${waktu.getDate()} ${namaBulan[waktu.getMonth()]} ${waktu.getFullYear()}`;

            highlightNextPrayer(waktu);
        }
        setInterval(updateWaktu, 1000);
        updateWaktu();

        // Slider dengan Efek Fade-In / Fade-Out Smooth
        function tampilkanSlide(index) {
            if (slideData.length === 0) return;
            const imgEl = document.getElementById('poster-img');
            const overlayEl = document.getElementById('poster-overlay');

            imgEl.style.opacity = '0';
            overlayEl.style.opacity = '0';

            setTimeout(() => {
                const slide = slideData[index];
                imgEl.src = slide.gambar;

                const judul = slide.judul ? slide.judul.trim() : '';
                const deskripsi = slide.deskripsi ? slide.deskripsi.trim() : '';

                if (!judul && !deskripsi) {
                    overlayEl.classList.add('hidden');
                } else {
                    overlayEl.classList.remove('hidden');
                    document.getElementById('poster-judul').textContent = judul;
                    document.getElementById('poster-deskripsi').textContent = deskripsi;
                }

                imgEl.style.opacity = '1';
                overlayEl.style.opacity = '1';
            }, 500);
        }

        function parseTanggalIndo(str) {
            const bulanIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const parts = str.replace(/,/g, '').split(' ');
            if (parts.length >= 4) {
                const hari = parseInt(parts[1]);
                const bulan = bulanIndo.indexOf(parts[2]);
                const tahun = parseInt(parts[3]);
                return new Date(tahun, bulan, hari);
            }
            return new Date(0);
        }

        // 2. Load data.json & Render Box Khutbah Ringkas
        async function loadDataJSON() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();

                document.getElementById('nama-masjid').textContent = data.masjid.nama;
                document.getElementById('tagline-masjid').textContent = data.masjid.tagline;
                document.getElementById('running-text').textContent = data.pengumuman;

                if (data.slides && data.slides.length > 0) {
                    slideData = data.slides;
                    tampilkanSlide(currentSlideIndex);
                }

                const hariIni = new Date();
                hariIni.setHours(0, 0, 0, 0);
                let indexJumatTerdekat = -1;

                for (let i = 0; i < data.jadwal_khutbah.length; i++) {
                    let tanggalJumat = parseTanggalIndo(data.jadwal_khutbah[i].tanggal);
                    if (tanggalJumat >= hariIni) {
                        indexJumatTerdekat = i;
                        break;
                    }
                }

                const containerKhutbah = document.getElementById('container-khutbah');
                containerKhutbah.innerHTML = ''; 

                const totalData = data.jadwal_khutbah.length;

                data.jadwal_khutbah.forEach((jadwal, index) => {
                    let cardStyle = "bg-slate-900/90 text-white border-slate-700/80";
                    let badge = "";
                    let extraCol = "";

                    if (totalData % 2 !== 0 && index === totalData - 1) {
                        extraCol = "sm:col-span-2";
                    }

                    if (index === indexJumatTerdekat) {
                        cardStyle = "bg-slate-900 text-white border-2 card-jumat-ini shadow-lg";
                        badge = `<span class="bg-orange-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full shadow-md float-right uppercase tracking-wider animate-bounce">JUM'AT INI</span>`;
                    }

                    containerKhutbah.innerHTML += `
                        <div class="${cardStyle} ${extraCol} px-3 py-2 rounded-2xl border shadow-md flex flex-col justify-between overflow-hidden">
                            <div>
                                ${badge}
                                <p class="text-[11px] sm:text-xs text-amber-400 font-extrabold uppercase tracking-wider leading-tight">${jadwal.tanggal}</p>
                            </div>
                            <div class="my-0.5">
                                <p class="text-[9px] font-bold text-slate-300 uppercase tracking-widest leading-none">Khotib:</p>
                                <p class="text-xs sm:text-sm font-black text-white leading-tight drop-shadow-sm truncate">${jadwal.khotib}</p>
                            </div>
                            <div>
                                <p class="text-[9px] font-bold text-slate-300 uppercase tracking-widest leading-none">Bilal:</p>
                                <p class="text-xs sm:text-sm font-black text-amber-300 leading-tight drop-shadow-sm truncate">${jadwal.bilal}</p>
                            </div>
                        </div>`;
                });
            } catch (error) {
                console.error("Gagal memuat JSON:", error);
            }
        }
        loadDataJSON();
        setInterval(loadDataJSON, 60000); 

        // 3. Slider Otomatis (7 Detik)
        setInterval(() => {
            if (slideData.length > 0) {
                currentSlideIndex = (currentSlideIndex + 1) % slideData.length;
                tampilkanSlide(currentSlideIndex);
            }
        }, 7000);

        // Highlight Waktu Sholat dengan Kartu Oranye Terang khas Referensi
        function highlightNextPrayer(waktu) {
            if (Object.keys(prayerTimesData).length === 0) return;
            const currentMins = waktu.getHours() * 60 + waktu.getMinutes();
            let nextPrayer = 'subuh';

            for (let name of prayerNames) {
                if (!prayerTimesData[name]) continue;
                let [h, m] = prayerTimesData[name].split(':').map(Number);
                let prayerMins = h * 60 + m;
                if (prayerMins > currentMins) {
                    nextPrayer = name;
                    break;
                }
            }

            prayerNames.forEach(name => {
                const box = document.getElementById(`box-${name}`);
                const title = document.getElementById(`title-${name}`);
                const time = document.getElementById(`waktu-${name}`);

                if (name === nextPrayer) {
                    box.className = "bg-gradient-to-b from-amber-500 to-orange-500 py-2.5 rounded-2xl border-2 border-white shadow-xl transform scale-105 transition-all duration-300";
                    title.className = "text-white font-black uppercase tracking-widest text-xs sm:text-sm";
                    time.className = "text-2xl sm:text-3xl lg:text-4xl font-black mt-0.5 text-white animate-pulse";
                } else {
                    box.className = "bg-slate-100/90 py-2.5 rounded-2xl border border-slate-200 shadow-sm transition-all duration-300";
                    title.className = "text-slate-600 font-extrabold uppercase tracking-widest text-xs sm:text-sm";
                    time.className = "text-2xl sm:text-3xl lg:text-4xl font-black mt-0.5 text-slate-900";
                }
            });
        }

        // 4. API Kemenag RI v1 (Sama persis dengan Tirto.id - Kota Surabaya ID: 1601)
        async function fetchJadwalKemenag() {
            try {
                const today = new Date();
                const tahun = today.getFullYear();
                const bulan = String(today.getMonth() + 1).padStart(2, '0');
                const tanggal = String(today.getDate()).padStart(2, '0');
                
                const url = `https://api.myquran.com/v1/sholat/jadwal/1601/${tahun}/${bulan}/${tanggal}`;
                const response = await fetch(url);
                const result = await response.json();

                if (result.status && result.data && result.data.jadwal) {
                    const j = result.data.jadwal;
                    
                    prayerTimesData = { 
                        subuh: j.subuh, 
                        syuruq: j.terbit, 
                        dzuhur: j.dzuhur, 
                        ashar: j.ashar, 
                        maghrib: j.maghrib, 
                        isya: j.isya 
                    };

                    document.getElementById('waktu-subuh').textContent = j.subuh;
                    document.getElementById('waktu-syuruq').textContent = j.terbit; 
                    document.getElementById('waktu-dzuhur').textContent = j.dzuhur;
                    document.getElementById('waktu-ashar').textContent = j.ashar;
                    document.getElementById('waktu-maghrib').textContent = j.maghrib;
                    document.getElementById('waktu-isya').textContent = j.isya;

                    highlightNextPrayer(new Date());
                } else {
                    fetchJadwalFallback(tahun, bulan, tanggal);
                }
            } catch (error) {
                console.error("Gagal mengambil API Tirto/Kemenag:", error);
            }
        }

        async function fetchJadwalFallback(tahun, bulan, tanggal) {
            try {
                const url = `https://api.myquran.com/v2/sholat/jadwal/1601/${tahun}/${bulan}/${tanggal}`;
                const response = await fetch(url);
                const result = await response.json();
                if (result.status && result.data && result.data.jadwal) {
                    const j = result.data.jadwal;
                    prayerTimesData = { subuh: j.subuh, syuruq: j.terbit, dzuhur: j.dzuhur, ashar: j.ashar, maghrib: j.maghrib, isya: j.isya };
                    document.getElementById('waktu-subuh').textContent = j.subuh;
                    document.getElementById('waktu-syuruq').textContent = j.terbit; 
                    document.getElementById('waktu-dzuhur').textContent = j.dzuhur;
                    document.getElementById('waktu-ashar').textContent = j.ashar;
                    document.getElementById('waktu-maghrib').textContent = j.maghrib;
                    document.getElementById('waktu-isya').textContent = j.isya;
                    highlightNextPrayer(new Date());
                }
            } catch (e) {
                console.error("Fallback error:", e);
            }
        }

        fetchJadwalKemenag();
        setInterval(fetchJadwalKemenag, 3600000);
    </script>
</body>
</html>
