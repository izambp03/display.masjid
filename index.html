<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Masjid Al-Khoirot</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden; 
        }
        .font-serif-elegan {
            font-family: 'Playfair Display', serif;
        }
        .running-text {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 25s linear infinite;
        }
        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
        @keyframes subtleGlow {
            0%, 100% {
                box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
                border-color: #D4AF37;
            }
            50% {
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
                border-color: #FFE885;
            }
        }
        .card-minggu-ini {
            animation: subtleGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-emerald-900 text-white h-screen w-screen flex flex-col justify-between">

    <!-- Header dengan Logo Masjid -->
    <header class="bg-emerald-950 flex justify-between items-center px-6 py-3 shadow-lg h-24 border-b-4 border-[#D4AF37] shrink-0 z-20">
        <div class="flex items-center gap-4">
            <img id="logo-img" src="logo-masjid.png" onError="this.onerror=null;this.src='https://img.icons8.com/color/96/mosque.png';" alt="Logo Masjid Al-Khoirot" class="w-14 h-14 rounded-full object-contain p-1 shadow-md border-2 border-[#D4AF37] bg-white shrink-0">
            <div>
                <h1 id="nama-masjid" class="font-serif-elegan text-3xl sm:text-4xl font-bold uppercase tracking-widest text-[#E5C158] drop-shadow-md">Memuat...</h1>
                <p id="tagline-masjid" class="text-emerald-200 text-base tracking-wide opacity-90">Memuat...</p>
            </div>
        </div>
        <div class="text-right">
            <h2 id="jam" class="text-4xl sm:text-5xl font-extrabold font-mono text-white tracking-wider drop-shadow-md">00:00:00</h2>
            <p id="tanggal" class="text-sm mt-0.5 text-emerald-200 font-medium">Memuat tanggal...</p>
        </div>
    </header>

    <!-- KONTEN UTAMA: Split 50:50 (Kiri Slider, Kanan Statis) -->
    <main class="flex-1 p-4 flex gap-4 items-center justify-center min-h-0 z-10">
        <!-- Sisi Kiri: Slider Gambar Berganti-ganti (50%) -->
        <div class="w-1/2 h-full bg-black rounded-2xl overflow-hidden relative shadow-xl border-4 border-emerald-800 flex items-center justify-center">
            <img id="poster-img" src="" alt="Slider" class="w-full h-full object-cover opacity-90 transition-opacity duration-700">
            <div id="poster-overlay" class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black via-black/80 to-transparent p-5">
                <h2 id="poster-judul" class="text-xl sm:text-2xl font-bold text-[#E5C158] drop-shadow-md">Memuat...</h2>
                <p id="poster-deskripsi" class="text-sm sm:text-base mt-1 text-white line-clamp-2">Memuat...</p>
            </div>
        </div>

        <!-- Sisi Kanan: Tampilan Statis / Tetap (50%) -->
        <div class="w-1/2 h-full bg-black rounded-2xl overflow-hidden relative shadow-xl border-4 border-emerald-800 flex items-center justify-center">
            <img id="static-img" src="" alt="Informasi Tetap" class="w-full h-full object-cover opacity-90">
            <div id="static-overlay" class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black via-black/80 to-transparent p-5">
                <h2 id="static-judul" class="text-xl sm:text-2xl font-bold text-[#E5C158] drop-shadow-md">YAYASAN MASJID AL-KHOIROT</h2>
                <p id="static-deskripsi" class="text-sm sm:text-base mt-1 text-white line-clamp-2">Selamat datang di Masjid Al-Khoirot Surabaya.</p>
            </div>
        </div>
    </main>

    <!-- AREA JADWAL KHOTIB & BILAL (Diperkecil & Badge Ditengahkan) -->
    <section class="px-6 pb-2 shrink-0 z-10">
        <div class="flex items-center justify-center mb-2">
            <div class="h-px bg-emerald-700/60 flex-1"></div>
            <h3 class="px-4 text-[#E5C158] font-bold uppercase tracking-widest text-xs sm:text-sm drop-shadow">Jadwal Khotib & Bilal Bulan Ini</h3>
            <div class="h-px bg-emerald-700/60 flex-1"></div>
        </div>
        
        <!-- Container 5 Box Khutbah Ringkas -->
        <div id="container-khutbah" class="grid grid-cols-5 gap-3 text-center">
            <!-- Data dari JSON dimuat secara dinamis -->
        </div>
    </section>

    <!-- PANEL WAKTU SHOLAT -->
    <section class="bg-emerald-950 px-6 py-3 shadow-[0_-5px_20px_rgba(0,0,0,0.3)] border-t-2 border-emerald-800 shrink-0 z-20">
        <div class="grid grid-cols-6 gap-3 text-center">
            <div id="box-subuh" class="bg-emerald-800 py-2.5 rounded-xl border border-emerald-600 shadow-md transition-all duration-300">
                <p id="title-subuh" class="text-[#E5C158] font-semibold uppercase tracking-wider text-xs">Subuh</p>
                <p id="waktu-subuh" class="text-3xl sm:text-4xl font-bold mt-0.5 text-white">--:--</p>
            </div>
            <div id="box-syuruq" class="bg-emerald-800 py-2.5 rounded-xl border border-emerald-600 shadow-md transition-all duration-300">
                <p id="title-syuruq" class="text-[#E5C158] font-semibold uppercase tracking-wider text-xs">Syuruq</p>
                <p id="waktu-syuruq" class="text-3xl sm:text-4xl font-bold mt-0.5 text-white">--:--</p>
            </div>
            <div id="box-dzuhur" class="bg-emerald-800 py-2.5 rounded-xl border border-emerald-600 shadow-md transition-all duration-300">
                <p id="title-dzuhur" class="text-[#E5C158] font-semibold uppercase tracking-wider text-xs">Dzuhur</p>
                <p id="waktu-dzuhur" class="text-3xl sm:text-4xl font-bold mt-0.5 text-white">--:--</p>
            </div>
            <div id="box-ashar" class="bg-emerald-800 py-2.5 rounded-xl border border-emerald-600 shadow-md transition-all duration-300">
                <p id="title-ashar" class="text-[#E5C158] font-semibold uppercase tracking-wider text-xs">Ashar</p>
                <p id="waktu-ashar" class="text-3xl sm:text-4xl font-bold mt-0.5 text-white">--:--</p>
            </div>
            <div id="box-maghrib" class="bg-emerald-800 py-2.5 rounded-xl border border-emerald-600 shadow-md transition-all duration-300">
                <p id="title-maghrib" class="text-[#E5C158] font-semibold uppercase tracking-wider text-xs">Maghrib</p>
                <p id="waktu-maghrib" class="text-3xl sm:text-4xl font-bold mt-0.5 text-white">--:--</p>
            </div>
            <div id="box-isya" class="bg-emerald-800 py-2.5 rounded-xl border border-emerald-600 shadow-md transition-all duration-300">
                <p id="title-isya" class="text-[#E5C158] font-semibold uppercase tracking-wider text-xs">Isya</p>
                <p id="waktu-isya" class="text-3xl sm:text-4xl font-bold mt-0.5 text-white">--:--</p>
            </div>
        </div>
    </section>

    <!-- FOOTER RUNNING TEXT -->
    <footer class="bg-black text-white h-12 flex items-center overflow-hidden text-lg border-t border-emerald-900 shrink-0 z-30">
        <div class="bg-[#D4AF37] text-black font-extrabold px-6 h-full flex items-center z-10 shadow-lg tracking-wider text-base shrink-0">
            INFORMASI
        </div>
        <div class="flex-1 overflow-hidden relative h-full flex items-center bg-gray-900">
            <div id="running-text" class="running-text text-[#E5C158] font-semibold tracking-wide">
                Memuat informasi...
            </div>
        </div>
    </footer>

    <script>
        let slideData = [];
        let currentSlideIndex = 0;
        const prayerNames = ['subuh', 'syuruq', 'dzuhur', 'ashar', 'maghrib', 'isya'];
        let prayerTimesData = {};

        // 1. Update Jam Realtime
        function updateWaktu() {
            const waktu = new Date();
            document.getElementById('jam').textContent = `${String(waktu.getHours()).padStart(2, '0')}:${String(waktu.getMinutes()).padStart(2, '0')}:${String(waktu.getSeconds()).padStart(2, '0')}`;
            const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jum\'at', 'Sabtu'];
            const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            document.getElementById('tanggal').textContent = `${namaHari[waktu.getDay()]}, ${waktu.getDate()} ${namaBulan[waktu.getMonth()]} ${waktu.getFullYear()}`;

            highlightNextPrayer(waktu);
        }
        setInterval(updateWaktu, 1000);
        updateWaktu();

        // Tampilkan Slide Kiri
        function tampilkanSlide(index) {
            if (slideData.length === 0) return;
            const slide = slideData[index];
            document.getElementById('poster-img').src = slide.gambar;

            const overlay = document.getElementById('poster-overlay');
            const judul = slide.judul ? slide.judul.trim() : '';
            const deskripsi = slide.deskripsi ? slide.deskripsi.trim() : '';

            if (!judul && !deskripsi) {
                overlay.classList.add('hidden');
            } else {
                overlay.classList.remove('hidden');
                document.getElementById('poster-judul').textContent = judul;
                document.getElementById('poster-deskripsi').textContent = deskripsi;
            }
        }

        function parseTanggalIndo(str) {
            const bulanIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const parts = str.replace(/,/g, '').split(' ');
            if (parts.length >= 4) {
                const hari = parseInt(parts[1]);
                const bulan = bulanIndo.indexOf(parts[2]);
                const tahun = parseInt(parts[3]);
                return new Date(tahun, bulan, hari);
            }
            return new Date(0);
        }

        // 2. Load data.json
        async function loadDataJSON() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();

                document.getElementById('nama-masjid').textContent = data.masjid.nama;
                document.getElementById('tagline-masjid').textContent = data.masjid.tagline;
                document.getElementById('running-text').textContent = data.pengumuman;

                if (data.slides && data.slides.length > 0) {
                    slideData = data.slides;
                    tampilkanSlide(currentSlideIndex);

                    // Gambar Statis Kanan (Mengambil slide pertama atau khusus)
                    if (data.slides_statis) {
                        document.getElementById('static-img').src = data.slides_statis.gambar;
                        document.getElementById('static-judul').textContent = data.slides_statis.judul || '';
                        document.getElementById('static-deskripsi').textContent = data.slides_statis.deskripsi || '';
                    } else if (data.slides.length > 1) {
                        document.getElementById('static-img').src = data.slides[1].gambar;
                        document.getElementById('static-judul').textContent = data.slides[1].judul || '';
                        document.getElementById('static-deskripsi').textContent = data.slides[1].deskripsi || '';
                    } else {
                        document.getElementById('static-img').src = data.slides[0].gambar;
                    }
                }

                const hariIni = new Date();
                hariIni.setHours(0, 0, 0, 0);
                let indexJumatTerdekat = -1;

                for (let i = 0; i < data.jadwal_khutbah.length; i++) {
                    let tanggalJumat = parseTanggalIndo(data.jadwal_khutbah[i].tanggal);
                    if (tanggalJumat >= hariIni) {
                        indexJumatTerdekat = i;
                        break;
                    }
                }

                const containerKhutbah = document.getElementById('container-khutbah');
                if (data.jadwal_khutbah.length === 4) {
                    containerKhutbah.className = "grid grid-cols-4 gap-3 text-center";
                } else {
                    containerKhutbah.className = "grid grid-cols-5 gap-3 text-center";
                }

                containerKhutbah.innerHTML = ''; 

                data.jadwal_khutbah.forEach((jadwal, index) => {
                    let cardClass = "bg-emerald-800/80 py-1.5 px-2 rounded-xl border border-emerald-600 shadow-md relative flex flex-col justify-center transition-all duration-300";
                    let badge = "";

                    if (index === indexJumatTerdekat) {
                        // Badge Jum'at Ini Tepat di Tengah Atas
                        cardClass = "bg-emerald-900 border-2 border-[#D4AF37] card-minggu-ini py-1.5 px-2 rounded-xl shadow-lg relative transform scale-102 z-10 flex flex-col justify-center transition-all duration-300";
                        badge = `<span class="bg-red-600 text-white text-[9px] font-extrabold px-2.5 py-0.5 rounded-full shadow absolute -top-2.5 left-1/2 transform -translate-x-1/2 tracking-wider uppercase animate-bounce whitespace-nowrap">JUM'AT INI</span>`;
                    }

                    containerKhutbah.innerHTML += `
                        <div class="${cardClass}">
                            ${badge}
                            <p class="text-[#E5C158] font-semibold uppercase tracking-wider text-[10px] border-b border-emerald-600/50 pb-0.5 mx-1 mb-1 pt-0.5">${jadwal.tanggal}</p>
                            <p class="text-[9px] text-emerald-200 uppercase tracking-widest">Khotib</p>
                            <p class="text-xs sm:text-sm font-bold text-white leading-tight mb-0.5 truncate">${jadwal.khotib}</p>
                            <p class="text-[9px] text-emerald-200 uppercase tracking-widest">Bilal</p>
                            <p class="text-xs sm:text-sm font-bold text-[#E5C158] leading-tight truncate">${jadwal.bilal}</p>
                        </div>`;
                });
            } catch (error) {
                console.error("Gagal memuat JSON:", error);
            }
        }
        loadDataJSON();
        setInterval(loadDataJSON, 60000); 

        // 3. Slider Otomatis (7 Detik)
        setInterval(() => {
            if (slideData.length > 0) {
                currentSlideIndex = (currentSlideIndex + 1) % slideData.length;
                tampilkanSlide(currentSlideIndex);
            }
        }, 7000);

        // Highlight Waktu Sholat
        function highlightNextPrayer(waktu) {
            if (Object.keys(prayerTimesData).length === 0) return;
            const currentMins = waktu.getHours() * 60 + waktu.getMinutes();
            let nextPrayer = 'subuh';

            for (let name of prayerNames) {
                if (!prayerTimesData[name]) continue;
                let [h, m] = prayerTimesData[name].split(':').map(Number);
                let prayerMins = h * 60 + m;
                if (prayerMins > currentMins) {
                    nextPrayer = name;
                    break;
                }
            }

            prayerNames.forEach(name => {
                const box = document.getElementById(`box-${name}`);
                const title = document.getElementById(`title-${name}`);
                const time = document.getElementById(`waktu-${name}`);

                if (name === nextPrayer) {
                    box.className = "bg-[#D4AF37] py-2.5 rounded-xl border-2 border-yellow-200 shadow-[0_0_15px_rgba(212,175,55,0.8)] transform scale-105 transition-all duration-300";
                    title.className = "text-emerald-950 font-extrabold uppercase tracking-wider text-xs";
                    time.className = "text-3xl sm:text-4xl font-extrabold mt-0.5 text-emerald-950 animate-pulse";
                } else {
                    box.className = "bg-emerald-800 py-2.5 rounded-xl border border-emerald-600 shadow-md transition-all duration-300";
                    title.className = "text-[#E5C158] font-semibold uppercase tracking-wider text-xs";
                    time.className = "text-3xl sm:text-4xl font-bold mt-0.5 text-white";
                }
            });
        }

        // 4. API Kemenag RI v1 (Sama persis dengan Tirto.id - Kota Surabaya ID: 1601)
        async function fetchJadwalKemenag() {
            try {
                const today = new Date();
                const tahun = today.getFullYear();
                const bulan = String(today.getMonth() + 1).padStart(2, '0');
                const tanggal = String(today.getDate()).padStart(2, '0');
                
                const url = `https://api.myquran.com/v1/sholat/jadwal/1601/${tahun}/${bulan}/${tanggal}`;
                const response = await fetch(url);
                const result = await response.json();

                if (result.status && result.data && result.data.jadwal) {
                    const j = result.data.jadwal;
                    
                    prayerTimesData = { 
                        subuh: j.subuh, 
                        syuruq: j.terbit, 
                        dzuhur: j.dzuhur, 
                        ashar: j.ashar, 
                        maghrib: j.maghrib, 
                        isya: j.isya 
                    };

                    document.getElementById('waktu-subuh').textContent = j.subuh;
                    document.getElementById('waktu-syuruq').textContent = j.terbit; 
                    document.getElementById('waktu-dzuhur').textContent = j.dzuhur;
                    document.getElementById('waktu-ashar').textContent = j.ashar;
                    document.getElementById('waktu-maghrib').textContent = j.maghrib;
                    document.getElementById('waktu-isya').textContent = j.isya;

                    highlightNextPrayer(new Date());
                } else {
                    fetchJadwalFallback(tahun, bulan, tanggal);
                }
            } catch (error) {
                console.error("Gagal mengambil API Tirto/Kemenag:", error);
            }
        }

        async function fetchJadwalFallback(tahun, bulan, tanggal) {
            try {
                const url = `https://api.myquran.com/v2/sholat/jadwal/1601/${tahun}/${bulan}/${tanggal}`;
                const response = await fetch(url);
                const result = await response.json();
                if (result.status && result.data && result.data.jadwal) {
                    const j = result.data.jadwal;
                    prayerTimesData = { subuh: j.subuh, syuruq: j.terbit, dzuhur: j.dzuhur, ashar: j.ashar, maghrib: j.maghrib, isya: j.isya };
                    document.getElementById('waktu-subuh').textContent = j.subuh;
                    document.getElementById('waktu-syuruq').textContent = j.terbit; 
                    document.getElementById('waktu-dzuhur').textContent = j.dzuhur;
                    document.getElementById('waktu-ashar').textContent = j.ashar;
                    document.getElementById('waktu-maghrib').textContent = j.maghrib;
                    document.getElementById('waktu-isya').textContent = j.isya;
                    highlightNextPrayer(new Date());
                }
            } catch (e) {
                console.error("Fallback error:", e);
            }
        }

        fetchJadwalKemenag();
        setInterval(fetchJadwalKemenag, 3600000);
    </script>
</body>
</html>
