<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Masjid Al-Khoirot</title>
    <!-- Google Fonts untuk Jam Digital & Typo Elegan -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden; 
        }
        .font-jam {
            font-family: 'Orbitron', monospace;
        }
        .running-text {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: marquee 25s linear infinite;
        }
        @keyframes marquee {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
        
        /* Animasi Glow Emas Tebal untuk Card Jum'at Ini */
        @keyframes jumatGlowThick {
            0%, 100% {
                box-shadow: 0 0 15px rgba(212, 175, 55, 0.7), inset 0 0 10px rgba(212, 175, 55, 0.3);
                border-color: #FFE885;
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 223, 0, 1), inset 0 0 20px rgba(255, 223, 0, 0.5);
                border-color: #FFFFFF;
            }
        }
        .card-jumat-ini {
            animation: jumatGlowThick 2s infinite ease-in-out;
        }

        /* Effect Fade In/Out untuk Slider */
        .fade-transition {
            transition: opacity 800ms ease-in-out;
        }

        /* Ornamen Islami Transparan Latar Belakang */
        .bg-islamic-pattern {
            background-color: #064e3b;
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%2310b981' fill-opacity='0.08' fill-rule='evenodd'%3E%3Cpath d='M0 0h80v80H0V0zm40 40M10 10h20v20H10V10zm40 0h20v20H50V10zm0 40h20v20H50V50zM10 50h20v20H10V50z'/%3E%3Cpath d='M40 0l40 40-40 40L0 40z'/%3E%3C/g%3E%3C/svg%3E");
        }

        .gold-glow-text {
            text-shadow: 0 0 12px rgba(229, 193, 88, 0.6);
        }
    </style>
</head>
<body class="bg-islamic-pattern text-white h-screen w-screen flex flex-col justify-between select-none">

    <!-- HEADER: Teks Masjid & Alamat Diperbesar dengan Efek Glow -->
    <header class="bg-emerald-950/90 backdrop-blur-md flex justify-between items-center px-8 py-4 shadow-2xl h-32 border-b-4 border-[#D4AF37] shrink-0 z-20">
        <div class="flex items-center gap-6">
            <img id="logo-img" src="logo.jpeg" 
                 onError="this.onerror=null; this.src='logo-masjid.png'; if(!this.src) this.src='https://img.icons8.com/color/96/mosque.png';" 
                 alt="Logo Masjid Al-Khoirot" 
                 class="w-20 h-20 rounded-full object-contain p-1 shadow-xl border-2 border-[#D4AF37] bg-white shrink-0">
            <div>
                <h1 id="nama-masjid" class="text-4xl sm:text-5xl font-black uppercase tracking-widest text-[#E5C158] gold-glow-text">Memuat...</h1>
                <p id="tagline-masjid" class="text-white text-lg sm:text-xl font-medium tracking-wide mt-1 opacity-95">Memuat...</p>
            </div>
        </div>
        <div class="text-right">
            <!-- Font Jam Digital Baru (Orbitron) & Tanggal Putih Bersih -->
            <h2 id="jam" class="font-jam text-5xl sm:text-6xl font-black text-white tracking-wider drop-shadow-lg">00:00:00</h2>
            <p id="tanggal" class="text-lg sm:text-xl mt-1 text-white font-bold tracking-wide">Memuat tanggal...</p>
        </div>
    </header>

    <!-- KONTEN UTAMA: Split 50:50 -->
    <main class="flex-1 flex gap-6 p-6 h-full overflow-hidden z-10">
        <!-- Area Slider Gambar (Kiri - 50%) -->
        <div class="w-6/12 h-full bg-black/80 rounded-3xl overflow-hidden relative shadow-2xl border-4 border-emerald-700/80 flex items-center justify-center">
            <img id="poster-img" src="" alt="Slider" class="w-full h-full object-cover opacity-100 fade-transition">
            <div id="poster-overlay" class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black via-black/80 to-transparent p-6 fade-transition">
                <h2 id="poster-judul" class="text-2xl sm:text-3xl font-bold text-[#E5C158] drop-shadow-md">Memuat...</h2>
                <p id="poster-deskripsi" class="text-lg sm:text-xl mt-2 text-white">Memuat...</p>
            </div>
        </div>

        <!-- Area Jadwal Khotib & Bilal (Kanan - 50% Font Besar Khusus Orang Tua) -->
        <div class="w-6/12 h-full bg-emerald-950/70 backdrop-blur-sm rounded-3xl shadow-2xl flex flex-col overflow-hidden border-2 border-emerald-600/80 p-6">
            <div class="bg-emerald-950 p-3.5 text-center border-b-2 border-[#D4AF37] rounded-2xl mb-4 shrink-0 shadow-lg">
                <h3 class="text-2xl sm:text-3xl font-black text-[#E5C158] uppercase tracking-widest gold-glow-text">Jadwal Khotib & Bilal Bulan Ini</h3>
            </div>
            
            <!-- Container Grid Terisi Penuh Fleksibel -->
            <div id="container-khutbah" class="flex-1 grid grid-cols-2 gap-4 h-full">
                <!-- Data dari JSON dimuat secara dinamis -->
            </div>
        </div>
    </main>

    <!-- PANEL WAKTU SHOLAT: Teks & Angka Diperbesar Sangat Jelas untuk Orang Tua -->
    <section class="bg-emerald-950/95 backdrop-blur-md p-5 shadow-2xl border-t-4 border-emerald-700 z-20 shrink-0">
        <div class="grid grid-cols-6 gap-5 text-center">
            <div id="box-subuh" class="bg-emerald-900/80 py-3.5 rounded-2xl border-2 border-emerald-700 shadow-lg transition-all duration-300">
                <p id="title-subuh" class="text-[#E5C158] font-black uppercase tracking-widest text-base sm:text-lg">Subuh</p>
                <p id="waktu-subuh" class="text-4xl sm:text-5xl font-black mt-1 text-white">--:--</p>
            </div>
            <div id="box-syuruq" class="bg-emerald-900/80 py-3.5 rounded-2xl border-2 border-emerald-700 shadow-lg transition-all duration-300">
                <p id="title-syuruq" class="text-[#E5C158] font-black uppercase tracking-widest text-base sm:text-lg">Syuruq</p>
                <p id="waktu-syuruq" class="text-4xl sm:text-5xl font-black mt-1 text-white">--:--</p>
            </div>
            <div id="box-dzuhur" class="bg-emerald-900/80 py-3.5 rounded-2xl border-2 border-emerald-700 shadow-lg transition-all duration-300">
                <p id="title-dzuhur" class="text-[#E5C158] font-black uppercase tracking-widest text-base sm:text-lg">Dzuhur</p>
                <p id="waktu-dzuhur" class="text-4xl sm:text-5xl font-black mt-1 text-white">--:--</p>
            </div>
            <div id="box-ashar" class="bg-emerald-900/80 py-3.5 rounded-2xl border-2 border-emerald-700 shadow-lg transition-all duration-300">
                <p id="title-ashar" class="text-[#E5C158] font-black uppercase tracking-widest text-base sm:text-lg">Ashar</p>
                <p id="waktu-ashar" class="text-4xl sm:text-5xl font-black mt-1 text-white">--:--</p>
            </div>
            <div id="box-maghrib" class="bg-emerald-900/80 py-3.5 rounded-2xl border-2 border-emerald-700 shadow-lg transition-all duration-300">
                <p id="title-maghrib" class="text-[#E5C158] font-black uppercase tracking-widest text-base sm:text-lg">Maghrib</p>
                <p id="waktu-maghrib" class="text-4xl sm:text-5xl font-black mt-1 text-white">--:--</p>
            </div>
            <div id="box-isya" class="bg-emerald-900/80 py-3.5 rounded-2xl border-2 border-emerald-700 shadow-lg transition-all duration-300">
                <p id="title-isya" class="text-[#E5C158] font-black uppercase tracking-widest text-base sm:text-lg">Isya</p>
                <p id="waktu-isya" class="text-4xl sm:text-5xl font-black mt-1 text-white">--:--</p>
            </div>
        </div>
    </section>

    <!-- FOOTER RUNNING TEXT -->
    <footer class="bg-black text-white h-16 flex items-center overflow-hidden text-2xl border-t-2 border-emerald-900 z-30 shrink-0">
        <div class="bg-[#D4AF37] text-black font-black px-8 h-full flex items-center z-10 shadow-2xl tracking-widest text-xl shrink-0">
            INFORMASI
        </div>
        <div class="flex-1 overflow-hidden relative h-full flex items-center bg-gray-950">
            <div id="running-text" class="running-text text-[#E5C158] font-bold tracking-wide text-2xl">
                Memuat informasi...
            </div>
        </div>
    </footer>

    <script>
        let slideData = [];
        let currentSlideIndex = 0;
        const prayerNames = ['subuh', 'syuruq', 'dzuhur', 'ashar', 'maghrib', 'isya'];
        let prayerTimesData = {};

        // 1. Update Jam Realtime
        function updateWaktu() {
            const waktu = new Date();
            document.getElementById('jam').textContent = `${String(waktu.getHours()).padStart(2, '0')}:${String(waktu.getMinutes()).padStart(2, '0')}:${String(waktu.getSeconds()).padStart(2, '0')}`;
            const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jum\'at', 'Sabtu'];
            const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            document.getElementById('tanggal').textContent = `${namaHari[waktu.getDay()]}, ${waktu.getDate()} ${namaBulan[waktu.getMonth()]} ${waktu.getFullYear()}`;

            highlightNextPrayer(waktu);
        }
        setInterval(updateWaktu, 1000);
        updateWaktu();

        // Slider dengan Efek Fade-In / Fade-Out Smooth
        function tampilkanSlide(index) {
            if (slideData.length === 0) return;
            const imgEl = document.getElementById('poster-img');
            const overlayEl = document.getElementById('poster-overlay');

            imgEl.style.opacity = '0';
            overlayEl.style.opacity = '0';

            setTimeout(() => {
                const slide = slideData[index];
                imgEl.src = slide.gambar;

                const judul = slide.judul ? slide.judul.trim() : '';
                const deskripsi = slide.deskripsi ? slide.deskripsi.trim() : '';

                if (!judul && !deskripsi) {
                    overlayEl.classList.add('hidden');
                } else {
                    overlayEl.classList.remove('hidden');
                    document.getElementById('poster-judul').textContent = judul;
                    document.getElementById('poster-deskripsi').textContent = deskripsi;
                }

                imgEl.style.opacity = '1';
                overlayEl.style.opacity = '1';
            }, 500);
        }

        function parseTanggalIndo(str) {
            const bulanIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const parts = str.replace(/,/g, '').split(' ');
            if (parts.length >= 4) {
                const hari = parseInt(parts[1]);
                const bulan = bulanIndo.indexOf(parts[2]);
                const tahun = parseInt(parts[3]);
                return new Date(tahun, bulan, hari);
            }
            return new Date(0);
        }

        // 2. Load data.json & Render Jadwal Khutbah Font Besar
        async function loadDataJSON() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                const data = await response.json();

                document.getElementById('nama-masjid').textContent = data.masjid.nama;
                document.getElementById('tagline-masjid').textContent = data.masjid.tagline;
                document.getElementById('running-text').textContent = data.pengumuman;

                if (data.slides && data.slides.length > 0) {
                    slideData = data.slides;
                    tampilkanSlide(currentSlideIndex);
                }

                const hariIni = new Date();
                hariIni.setHours(0, 0, 0, 0);
                let indexJumatTerdekat = -1;

                for (let i = 0; i < data.jadwal_khutbah.length; i++) {
                    let tanggalJumat = parseTanggalIndo(data.jadwal_khutbah[i].tanggal);
                    if (tanggalJumat >= hariIni) {
                        indexJumatTerdekat = i;
                        break;
                    }
                }

                const containerKhutbah = document.getElementById('container-khutbah');
                containerKhutbah.innerHTML = ''; 

                const totalData = data.jadwal_khutbah.length;

                data.jadwal_khutbah.forEach((jadwal, index) => {
                    let cardStyle = "bg-emerald-900/90 border-emerald-600/80";
                    let badge = "";
                    let extraCol = "";

                    if (totalData % 2 !== 0 && index === totalData - 1) {
                        extraCol = "col-span-2";
                    }

                    if (index === indexJumatTerdekat) {
                        cardStyle = "bg-emerald-900 border-4 card-jumat-ini shadow-2xl";
                        badge = `<span class="bg-red-600 text-white text-xs font-black px-3 py-1 rounded-full shadow-lg float-right uppercase tracking-widest animate-bounce">JUM'AT INI</span>`;
                    }

                    // Teks Hari, Tanggal, Khotib & Bilal Diperbesar Khusus Lansia/Orang Tua
                    containerKhutbah.innerHTML += `
                        <div class="${cardStyle} ${extraCol} p-4 rounded-2xl border shadow-xl flex flex-col justify-between">
                            <div>
                                ${badge}
                                <p class="text-sm sm:text-base text-[#E5C158] font-extrabold uppercase tracking-wider mb-1">${jadwal.tanggal}</p>
                            </div>
                            <div class="my-1">
                                <p class="text-xs sm:text-sm font-bold text-emerald-200 uppercase tracking-widest">Khotib:</p>
                                <p class="text-lg sm:text-xl font-black text-white leading-snug drop-shadow-sm">${jadwal.khotib}</p>
                            </div>
                            <div class="mt-1">
                                <p class="text-xs sm:text-sm font-bold text-emerald-200 uppercase tracking-widest">Bilal:</p>
                                <p class="text-lg sm:text-xl font-black text-[#E5C158] leading-snug drop-shadow-sm">${jadwal.bilal}</p>
                            </div>
                        </div>`;
                });
            } catch (error) {
                console.error("Gagal memuat JSON:", error);
            }
        }
        loadDataJSON();
        setInterval(loadDataJSON, 60000); 

        // 3. Slider Otomatis (7 Detik)
        setInterval(() => {
            if (slideData.length > 0) {
                currentSlideIndex = (currentSlideIndex + 1) % slideData.length;
                tampilkanSlide(currentSlideIndex);
            }
        }, 7000);

        // Highlight Waktu Sholat dengan Animasi Berpijar Modern
        function highlightNextPrayer(waktu) {
            if (Object.keys(prayerTimesData).length === 0) return;
            const currentMins = waktu.getHours() * 60 + waktu.getMinutes();
            let nextPrayer = 'subuh';

            for (let name of prayerNames) {
                if (!prayerTimesData[name]) continue;
                let [h, m] = prayerTimesData[name].split(':').map(Number);
                let prayerMins = h * 60 + m;
                if (prayerMins > currentMins) {
                    nextPrayer = name;
                    break;
                }
            }

            prayerNames.forEach(name => {
                const box = document.getElementById(`box-${name}`);
                const title = document.getElementById(`title-${name}`);
                const time = document.getElementById(`waktu-${name}`);

                if (name === nextPrayer) {
                    box.className = "bg-gradient-to-b from-[#FFE885] to-[#D4AF37] py-3.5 rounded-2xl border-4 border-white shadow-[0_0_25px_rgba(212,175,55,1)] transform scale-105 transition-all duration-300";
                    title.className = "text-emerald-950 font-black uppercase tracking-widest text-base sm:text-lg";
                    time.className = "text-4xl sm:text-5xl font-black mt-1 text-emerald-950 animate-pulse";
                } else {
                    box.className = "bg-emerald-900/80 py-3.5 rounded-2xl border-2 border-emerald-700 shadow-lg transition-all duration-300";
                    title.className = "text-[#E5C158] font-black uppercase tracking-widest text-base sm:text-lg";
                    time.className = "text-4xl sm:text-5xl font-black mt-1 text-white";
                }
            });
        }

        // 4. API Kemenag RI v1 (Sama persis dengan Tirto.id - Kota Surabaya ID: 1601)
        async function fetchJadwalKemenag() {
            try {
                const today = new Date();
                const tahun = today.getFullYear();
                const bulan = String(today.getMonth() + 1).padStart(2, '0');
                const tanggal = String(today.getDate()).padStart(2, '0');
                
                const url = `https://api.myquran.com/v1/sholat/jadwal/1601/${tahun}/${bulan}/${tanggal}`;
                const response = await fetch(url);
                const result = await response.json();

                if (result.status && result.data && result.data.jadwal) {
                    const j = result.data.jadwal;
                    
                    prayerTimesData = { 
                        subuh: j.subuh, 
                        syuruq: j.terbit, 
                        dzuhur: j.dzuhur, 
                        ashar: j.ashar, 
                        maghrib: j.maghrib, 
                        isya: j.isya 
                    };

                    document.getElementById('waktu-subuh').textContent = j.subuh;
                    document.getElementById('waktu-syuruq').textContent = j.terbit; 
                    document.getElementById('waktu-dzuhur').textContent = j.dzuhur;
                    document.getElementById('waktu-ashar').textContent = j.ashar;
                    document.getElementById('waktu-maghrib').textContent = j.maghrib;
                    document.getElementById('waktu-isya').textContent = j.isya;

                    highlightNextPrayer(new Date());
                } else {
                    fetchJadwalFallback(tahun, bulan, tanggal);
                }
            } catch (error) {
                console.error("Gagal mengambil API Tirto/Kemenag:", error);
            }
        }

        async function fetchJadwalFallback(tahun, bulan, tanggal) {
            try {
                const url = `https://api.myquran.com/v2/sholat/jadwal/1601/${tahun}/${bulan}/${tanggal}`;
                const response = await fetch(url);
                const result = await response.json();
                if (result.status && result.data && result.data.jadwal) {
                    const j = result.data.jadwal;
                    prayerTimesData = { subuh: j.subuh, syuruq: j.terbit, dzuhur: j.dzuhur, ashar: j.ashar, maghrib: j.maghrib, isya: j.isya };
                    document.getElementById('waktu-subuh').textContent = j.subuh;
                    document.getElementById('waktu-syuruq').textContent = j.terbit; 
                    document.getElementById('waktu-dzuhur').textContent = j.dzuhur;
                    document.getElementById('waktu-ashar').textContent = j.ashar;
                    document.getElementById('waktu-maghrib').textContent = j.maghrib;
                    document.getElementById('waktu-isya').textContent = j.isya;
                    highlightNextPrayer(new Date());
                }
            } catch (e) {
                console.error("Fallback error:", e);
            }
        }

        fetchJadwalKemenag();
        setInterval(fetchJadwalKemenag, 3600000);
    </script>
</body>
</html>
